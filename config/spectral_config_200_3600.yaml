execution:
  cleanup_temp_files: false
  debug_mode: true
  max_workers: 32
  timeout_seconds: 60
output:
  filename_prefix: xarray_example
  filename_suffix: .nc
  netcdf_encoding: null
  variable_encoding: {}
paths:
  atmosphere_profile: /projekt_agmwend/data/HALO-AC3/05_VELOX_Tools/add_data/afglsw.dat
  libradtran_bin: /opt/libradtran/bin/uvspec
  libradtran_data: /opt/libradtran/share/libRadtran/data
  output_dir: work
  radiosonde_base: null
  solar_spectrum: /projekt_agmwend/home_rad/sophie/libradtran/solar_flux/NewGuey2003.dat
  working_dir: work
simulation_defaults:
  integrate_wavelength: false
  mol_abs_param: reptran per_nm
  output_altitudes_km:
  - 3.738
  output_columns:
  - zout
  - lambda
  - sza
  - edir
  - eglo
  - edn
  - eup
  - enet
  - albedo
  ozone_du: 300.0
  phi: null
  rte_solver: disort
  surface_temperature_k: 273.15
  transmittance_source: default
  umu: null
  viewing_geometry: nadir
  wavelength_nm:
  - 400
  - 4500
