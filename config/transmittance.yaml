  filename_suffix: .nc
  netcdf_encoding: null
  variable_encoding: {}
paths:
  atmosphere_profile: /projekt_agmwend/data/HALO-AC3/05_VELOX_Tools/add_data/afglsw.dat
  libradtran_bin: /opt/libradtran/2.0.4/bin/uvspec
