paths:
  libradtran_data: /opt/libRadtran-2.0.6/data
  libradtran_bin: /opt/libRadtran-2.0.6/bin/uvspec
  atmosphere_profile: /opt/libRadtran-2.0.6/examples/ATMOSPHERE_IPA.DAT
  solar_spectrum: /opt/libRadtran-2.0.6/data/solar_flux/atlas_plus_modtran
  output_dir: ./pyradtran_output
  working_dir: ./pyradtran_work
simulation_defaults:
  rte_solver: twostr
  mol_abs_param: null
  source: solar
  wavelength_nm: []
  albedo_value: null
  output_altitudes_km: []
  output_columns: []
  viewing_geometry: custom
  parameter_overrides:
    include: /opt/libRadtran-2.0.6/examples/UVSPEC_CLEAR.INP
    aerosol_vulcan: 1
    aerosol_haze: 6
    aerosol_season: 1
    aerosol_visibility: 20.0
    aerosol_angstrom: 1.1 0.2
    aerosol_modify: gg set 0.70
    aerosol_file: tau /opt/libRadtran-2.0.6/examples/AERO_TAU.DAT
