[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyradtran"
version = "0.1.0"
description = "A flexible Python wrapper for the libradtran radiative transfer model"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Joshua Müller", email = "josh2197@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "xarray>=0.20.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.1.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.931",
]
docs = [
    "sphinx>=4.4.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.17.0",
    "nbsphinx>=0.8.8",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/FranzFlink/pyRadtran"
"Documentation" = "https://franzflink.github.io/pyRadtran/"
"Bug Tracker" = "https://github.com/FranzFlink/pyRadtran/issues"

[tool.setuptools]
packages = ["pyradtran"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*", "xarray.*", "yaml.*"]
ignore_missing_imports = true