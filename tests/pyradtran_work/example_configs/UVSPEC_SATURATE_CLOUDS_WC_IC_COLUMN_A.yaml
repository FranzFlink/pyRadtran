  source: solar /opt/libRadtran-2.0.6/data/solar_flux/kurudz_1.0nm.dat
  sza: 30.0
  pseudospherical: ''
  wavelength: 580.0 600.0
  aerosol_default: ''
  aerosol_visibility: 20
  wc_file: 1D /opt/libRadtran-2.0.6/examples/WC50_A.DAT
  ic_file: 1D /opt/libRadtran-2.0.6/examples/IC50_A_R.DAT
  mol_file: H2O /opt/libRadtran-2.0.6/examples/RH50_A_WC_IC.DAT RH
  quiet: ''
