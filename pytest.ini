# pytest.ini
[pytest]
testpaths = tests
pythonpath = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -ra
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require libradtran installation)
    slow: Slow tests including real network calls (IGRA2, ERA5 Zarr)
    io: Tests for input/output functionality
    interface: Tests for the main interface
    config: Tests for configuration handling
