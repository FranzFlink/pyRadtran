execution:
  cleanup_temp_files: true
  max_workers: 6
  timeout_seconds: 600
paths:
  atmosphere_profile: afglt
  output_dir: pyradtran_output
  working_dir: pyradtran_work
simulation_defaults:
  source: thermal
  rte_solver: disort
  mol_abs_param: reptran coarse
  wavelength_nm:
  - 3000
  - 100000
  integrate_wavelength: true
  output_altitudes_km:
  - 0.0
  output_columns:
  - edn
  - eup
  albedo_value: 0.0
  # keep the gas profiles of the atmosphere file as written (no column rescaling)
  h2o_mm: null
  ozone_du: null
