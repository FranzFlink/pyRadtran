execution:
  cleanup_temp_files: false
  debug_mode: false
  max_workers: 32
  timeout_seconds: 3600
output:
  filename_prefix: xarray_example
  filename_suffix: .nc
  netcdf_encoding: null
  variable_encoding: {}
paths:
  radiosonde_base: ~/pyRadtran/book/notebooks/radiosonde/
simulation_defaults:
  integrate_wavelength: true
  mol_abs_param: reptran medium
  output_altitudes_km:
  - 0.0
  output_columns:
  - zout
  - lambda
  - sza
  - edir
  - eglo
  - edn
  - eup
  - enet
  - albedo
  ozone_du: null
  h2o_mm: null
  phi: null
  rte_solver: disort  
  surface_temperature_k: 253.15
  transmittance_source: default
  umu: null
  wavelength_nm:
  - 290
  - 4500
