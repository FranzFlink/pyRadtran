# Fast solar broadband simulation with clouds (twostr solver)
# Paths are loaded from ~/.pyradtran/config.yaml (master config)

simulation_defaults:
  rte_solver: twostr
  mol_abs_param: reptran medium
  source: solar
  wavelength_nm: [290, 3600]
  integrate_wavelength: true
  output_columns: [zout, lambda, sza, edir, eglo, edn, eup, enet, albedo]

execution:
  cleanup_temp_files: false
  max_workers: 16
  timeout_seconds: 60

output:
  filename_prefix: cloud_solar_fast
  filename_suffix: .nc
