# Broadband thermal irradiance at the surface, for Arctic cloud radiative
# effect studies. Paths come from ~/.pyradtran/config.yaml (master config).
# Output is in W m-2. In thermal runs libRadtran takes albedo = 1 - emissivity.

paths:
  atmosphere_profile: afglsw     # subarctic winter

simulation_defaults:
  source: thermal
  rte_solver: disort
  mol_abs_param: reptran coarse
  wavelength_nm: [4000, 100000]
  integrate_wavelength: true
  output_columns: [edn, eup]
  output_altitudes_km: [0.0]
  h2o_mm: null                   # keep the humidity of the profile
  ozone_du: null                 # keep the ozone of the profile

execution:
  max_workers: 8
  timeout_seconds: 300
  cleanup_temp_files: true

output:
  filename_prefix: arctic_cloud_experiment_thermal
  filename_suffix: .nc
