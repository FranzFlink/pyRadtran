# Fast thermal simulation with clouds
# Paths are loaded from ~/.pyradtran/config.yaml (master config)

simulation_defaults:
  rte_solver: disort
  mol_abs_param: reptran medium
  source: thermal
  wavelength_nm: [3500, 50000]
  integrate_wavelength: true
  output_columns: [zout, lambda, sza, edir, eglo, edn, eup, enet, albedo]

execution:
  cleanup_temp_files: false
  max_workers: 16
  timeout_seconds: 60

output:
  filename_prefix: cloud_thermal_fast
  filename_suffix: .nc
