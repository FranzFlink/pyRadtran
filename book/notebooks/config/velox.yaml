execution:
  cleanup_temp_files: false
  debug_mode: false
  max_workers: 16
  timeout_seconds: 60
simulation_defaults:
  integrate_wavelength: true
  mol_abs_param: reptran medium
  output_columns:
  - zout
  - lambda
  - eup
  - edn
  - edir
  ozone_du: 300.0
  rte_solver: disort
  source: thermal
  surface_temperature_k: 248.4
  wavelength_nm:
  - 7700
  - 12000
