# Radiosonde-driven broadband solar simulation
# Paths are loaded from ~/.pyradtran/config.yaml (master config)

simulation_defaults:
  rte_solver: disort
  mol_abs_param: reptran per_nm
  source: solar
  wavelength_nm: [400, 4500]
  integrate_wavelength: true
  h2o_source: radiosonde
  albedo_value: 0.3
  surface_temperature_k: 253.15
  ozone_du: 300.0
  output_altitudes_km: [0.0]
  output_columns: [zout, lambda, sza, edir, eglo, edn, eup, enet, albedo]

execution:
  cleanup_temp_files: false
  max_workers: 16
  timeout_seconds: 60

output:
  filename_prefix: radiosonde_solar
  filename_suffix: .nc
