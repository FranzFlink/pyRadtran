# Spectral single-altitude test: no integration, single altitude
# Paths are loaded from ~/.pyradtran/config.yaml (master config)

simulation_defaults:
  rte_solver: disort
  mol_abs_param: reptran
  source: solar
  wavelength_nm: [400, 450]
  integrate_wavelength: false
  output_altitudes_km: [0.0]
  output_columns: [eglo, eup, edir]
  albedo_value: 0.8

execution:
  max_workers: 1
  debug_mode: true
  timeout_seconds: 60

output:
  filename_prefix: test_spectral_single
