paths:
  atmosphere_profile: /projekt_agmwend/data/HALO-AC3/05_VELOX_Tools/add_data/afglsw.dat
  solar_spectrum: /projekt_agmwend/home_rad/sophie/libradtran/solar_flux/NewGuey2003.dat
  radiosonde_base: /projekt_agmwend/data/HALO-AC3/01_soundings/RS_for_libradtran/Dropsondes_HALO/
  output_dir: /projekt_agmwend/home_rad/Joshua/HALO-AC3_Arctic_leads/data/simulation/libradpy_output/
  working_dir: /projekt_agmwend/home_rad/Joshua/HALO-AC3_Arctic_leads/sim/libradpy_work/
simulation_defaults:
  rte_solver: twostr
  mol_abs_param: lowtran per_nm
  wavelength_nm:
  - 400
  - 3600
  output_columns:
  - sza
  - edir
  - eglo
  - edn
  - eup
  - enet
  - albedo
  output_altitudes_km:
  - 0.0
  albedo_type: const
  albedo_value: 0.85
  surface_type: tundra
  brdf_type: lambertian
  surface_temperature_k: 250.0
  ozone_du: 300.0
  h2o_mm: 2.0
  h2o_source: radiosonde
  aerosol_type: default
  viewing_geometry: nadir
execution:
  max_workers: 8
  cleanup_temp_files: true
  debug_mode: false
  timeout_seconds: 300
output:
  filename_prefix: libradpy_sim
  filename_suffix: _results.nc
  netcdf_encoding:
    zlib: true
    complevel: 5
