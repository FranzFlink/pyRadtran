paths:
  solar_spectrum: /projekt_agmwend/home_rad/sophie/libradtran/solar_flux/NewGuey2003.dat
  working_dir: ./work
simulation_defaults:
  rte_solver: disort
  mol_abs_param: reptran
  source: solar
  wavelength_nm:
  - 400
  - 800
  albedo_type: constant
  albedo_value: 0.15
  output_altitudes_km:
  - 0.0
  - 5.0
  - 10.0
  output_columns:
  - lambda
  - zout
  - edir
  - edn
  - eup
  - eglo
  mol_modify:
    O3:
      value: 300
      unit: DU
  clouds:
    enabled: true
    cloud_source: file
    cloud_type: mixed
    wc_file: /opt/libradtran/share/libRadtran/examples/WCSIMPLE.DAT
    ic_file: /opt/libradtran/share/libRadtran/examples/IC50_A.DAT
    wc_properties: mie
    ic_properties: yang
    cloud_overlap: max-random
    use_ipa: false
execution:
  max_workers: 4
  cleanup_temp_files: true
  debug_mode: false
output:
  filename_prefix: cloud_file_sim
  filename_suffix: _results.nc
