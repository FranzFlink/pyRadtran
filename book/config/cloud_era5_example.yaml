paths:
  solar_spectrum: /projekt_agmwend/home_rad/sophie/libradtran/solar_flux/NewGuey2003.dat
  working_dir: ./work
simulation_defaults:
  rte_solver: disort
  mol_abs_param: reptran
  source: solar
  wavelength_nm:
  - 400
  - 3200
  integrate_wavelength: false
  albedo_type: constant
  albedo_value: 0.3
  output_altitudes_km:
  - 0.0
  - 1.0
  - 5.0
  - 10.0
  output_columns:
  - lambda
  - zout
  - edir
  - edn
  - eup
  - eglo
  mol_modify:
    O3:
      value: 300
      unit: DU
  clouds:
    enabled: true
    cloud_source: era5
    cloud_type: wc
    era5_cloud_variables:
      lwc: clwc
      iwc: ciwc
      cc: cc
      temp: t
      z: z
    era5_time: null
    era5_lat: null
    era5_lon: null
    lwc_threshold: 1.0e-06
    iwc_threshold: 1.0e-06
    default_r_eff_water: 10.0
    default_r_eff_ice: 30.0
    altitude_resolution_km: 0.2
    wc_properties: mie
    ic_properties: yang
    auto_generate_files: true
    output_directory: ./cloud_files
    cloud_overlap: max-random
    use_ipa: false
execution:
  max_workers: 4
  cleanup_temp_files: true
  debug_mode: false
  timeout_seconds: 300
output:
  filename_prefix: cloud_era5_sim
  filename_suffix: _results.nc
  netcdf_encoding:
    zlib: true
    complevel: 5
