# Table of contents
# Learn more at https://jupyterbook.org/customize/toc.html
#
# Notebooks are grouped by topic; every group has a short landing page
# (tutorials/*.md, case_studies/*.md). `title:` sets the sidebar label.

format: jb-book
root: intro
parts:
  - caption: Getting Started
    chapters:
    - file: installation
    - file: notebooks/quickstart
      title: Quickstart
    - file: guide/concepts

  - caption: User Guide
    chapters:
    - file: guide/configuration
    - file: guide/parameters
      sections:
      - file: notebooks/parameters_deep_dive
        title: Deep dive (notebook)
    - file: guide/atmosphere
    - file: guide/clouds
    - file: guide/outputs
    - file: guide/debugging
    - file: examples/index

  - caption: Tutorials
    chapters:
    - file: notebooks/index
      title: Overview
    - file: tutorials/basics
      sections:
      - file: notebooks/albedo_test
        title: "Surface albedo"
      - file: notebooks/solar_spectral
        title: "Solar spectra"
      - file: notebooks/thermal
        title: "Broadband thermal"
      - file: notebooks/thermal_imager
        title: "Brightness temperature"
    - file: tutorials/atmosphere
      sections:
      - file: notebooks/era5_atmosphere
        title: "ERA5 atmosphere"
      - file: notebooks/get_radiosonde
        title: "Radiosondes (IGRA2)"
    - file: tutorials/clouds
      sections:
      - file: notebooks/water_cloud
        title: "Water clouds"
