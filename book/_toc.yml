        title: "Shupe & Intrieri (2004)"
      - file: notebooks/era5_seasonal_sea_ice_profiles
        title: "Shupe & Intrieri with seasonal ERA5 profiles"
      - file: notebooks/spectral_albedo_shift_cloud
        title: "Cloud forcing with ACLOUD data"
    - file: case_studies/thermal_imaging
