        title: "Mixed-phase clouds"
    - file: tutorials/instruments
      sections:
      - file: notebooks/led_horizontal_extinction
        title: "Horizontal LED extinction"

  - caption: Case Studies
    chapters:
    - file: case_studies/cloud_forcing
      sections:
      - file: notebooks/arctic_cloud_experiment
        title: "Multi-dimensional cloud experiment"
